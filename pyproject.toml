[project]
name = "arc-life-tracker"
version = "1.0.0rc2"
description = "Offline-first daily life tracker with secure accounts and Supabase cloud backup."
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.3",
    "flet-secure-storage==1.0.3",
    "supabase==2.32.0",
]

[tool.flet]
product = "ARC Daily Life Tracker"
org = "com.nityansh.arc"
company = "Nityansh"
bundle_id = "com.nityansh.arc"
build_version = "1.0.0"
build_number = 11

[tool.flet.app]
path = "."

[tool.flet.android]
split_per_abi = false

[tool.flet.android.manifest_application]
"allowBackup" = "false"
"fullBackupContent" = "false"
