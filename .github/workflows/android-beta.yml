name: Build Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependency
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install ARC dependencies
        run: pip install -r requirements.txt
      - name: Build ARC Android APK
        run: flet build apk --yes --build-version 1.0.0 --build-number 11
      - name: Upload release candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: arc-android-1.0.0-rc2
          path: build/apk/*.apk
          if-no-files-found: error
